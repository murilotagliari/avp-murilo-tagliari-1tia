<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porsche - contato</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
     <link rel="stylesheet" href="css/style.css" />
  </head>
<body>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<header class="abas">

    <nav class="navbar">
        <i class="fa-solid fa-bars"></i>

        <a href="index.html"> <img src="FOTOS/Porsche LOGO.jpg" class="logo" alt="Porsche">   </a>

        <div class="nav-icons">
          <a href="contato.html"> <i class="fa-regular fa-user"></i> </a>
        </div>
    </nav>

</header>

    <main>
        <h2>Entre em contato</h2>
        <p>
          Envie sua opinião sobre o site e sobre a Porsche.
        </p>
        <form>
            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" required>
            <br><br>
            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="modelo">Modelo favorito:</label>
            <br>
            <select id="modelo" name="modelo">
                <option value="911">Porsche 911</option>
                <option value="cayenne">Porsche Cayenne</option>
                <option value="taycan">Porsche Taycan</option>
            </select>
            <br><br>
            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea id="mensagem"
                      name="mensagem"
                      rows="6"
                      cols="40"
                      placeholder="Digite sua mensagem..."></textarea>
            <br><br>
            <button type="submit">Enviar</button>
        </form>
    </main>

  <footer>
   <p>Desenvolvido por Murilo Tagliari</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

</body>

</html>
