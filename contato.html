  <main class="contato">
    <div class="contato-container">
        <div class="contato-titulo">
            <h2>Entre em contato</h2>
            <p>
                Envie sua opinião sobre o site e sobre a Porsche.
            </p>
        </div>

        <form class="formulario">
            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="modelo">Modelo favorito</label>
                <select id="modelo" name="modelo">
                    <option value="911">Porsche 911</option>
                    <option value="cayenne">Porsche Cayenne</option>
                    <option value="taycan">Porsche Taycan</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    placeholder="Digite sua mensagem..."
                ></textarea>
            </div>

            <button type="submit">Enviar mensagem</button>
        </form>
    </div>
</main>


  <footer>
   <p>Desenvolvido por Murilo Tagliari</p>
  </footer>
